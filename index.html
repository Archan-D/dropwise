<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dropwise</title>
<meta name="description" content="Build post-operative eye drop schedules and patient sheets in eight languages.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Gurmukhi:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<link rel="stylesheet" href="css/dropwise.css">
<style>
/* Layout: clinician control panel on the left, the printable patient sheet on a "desk" to the right; stacks on phones. */
.app{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);min-height:100vh}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--panel);border-right:1px solid var(--rule);padding:24px 20px 40px;display:flex;flex-direction:column;gap:22px}
@media (min-width:901px){.panel{position:sticky;top:0;height:100vh;overflow-y:auto}}
@media (max-width:900px){.panel{border-right:0;border-bottom:1px solid var(--rule);padding-inline:16px}}
.brand h1{margin:0;font-size:1.6rem;display:flex;align-items:center;gap:8px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.drop-mark{width:14px;height:19px;background:var(--accent);border-radius:50%/60% 60% 40% 40%;transform:rotate(180deg);display:inline-block}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:8px}
label{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{font-size:.92rem;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{flex-direction:row;justify-content:center;padding:8px;cursor:pointer;font-weight:700;background:var(--field)}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-3px}
.check{flex-direction:row;align-items:center;gap:8px}.check input{width:auto}
.drops{display:flex;flex-direction:column;gap:12px}
.drop{border:1px solid var(--rule);border-radius:8px;background:var(--field);padding:10px;display:flex;flex-direction:column;gap:8px}
.drop-head{display:flex;align-items:center;gap:8px}.drop-head select{flex:1}
.phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.phases li{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,.8fr) auto auto;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.phases select,.phases input{padding:5px 6px;font-size:.85rem}
.x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1;cursor:pointer;padding:4px 6px;border-radius:4px}
.x:hover{color:var(--warn)}
.link{border:0;background:transparent;color:var(--accent);font-size:.85rem;font-weight:700;cursor:pointer;padding:2px 0;align-self:flex-start}
.btn{border:1px dashed var(--accent);background:transparent;color:var(--accent);font-weight:700;border-radius:8px;padding:9px;cursor:pointer}
.btn.solid{border-style:solid;background:var(--accent);color:var(--accent-ink)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.basis{font-size:.82rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.basis strong{color:var(--ink)}.basis a{color:var(--accent)}.basis ul{margin:0;padding-inline-start:18px}
.status{font-size:.82rem;color:var(--good);min-height:1.2em}

.stage{padding:28px 24px 60px;display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
@media (max-width:900px){.stage{padding-inline:16px}}
.demo-note{max-width:820px;width:100%;font-size:.85rem;background:var(--warn-bg);border-radius:8px;padding:10px 14px}
.demo-note b{color:var(--warn)}
.sheet{background:var(--paper);width:100%;max-width:820px;border-radius:4px;box-shadow:0 1px 2px rgba(20,30,45,.08),0 8px 28px rgba(20,30,45,.10);padding:36px 40px 32px;display:flex;flex-direction:column;gap:26px;font-size:16px}
@media (max-width:600px){.sheet{padding:22px 16px}}
.sheet:lang(ar){font-size:17px}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:16px}
.s-head h2{margin:0;font-size:1.75rem;line-height:1.2;text-wrap:balance}
.eye-badge{border:3px solid var(--ink);border-radius:10px;padding:8px 14px;text-align:center;font-weight:700;font-size:1.25rem;line-height:1.2}
.eye-badge small{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 24px;margin:0}
.meta div{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta dt{font-size:.75rem;font-weight:700;color:var(--muted)}
.meta dd{margin:0;font-weight:700;border-bottom:1px solid var(--rule);min-height:1.6em;overflow-wrap:anywhere}
.s-sec{display:flex;flex-direction:column;gap:10px}
.s-sec h3{margin:0;font-size:1.15rem}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 20px}
.qr-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;border:2px dashed var(--rule);border-radius:10px;padding:14px 18px}
.qr-box .qr{width:132px;height:132px;background:#fff;padding:4px;border-radius:6px}
.qr-box .qr svg{width:100%;height:100%;display:block}
.qr-box p{margin:0;font-weight:700;font-size:1.05em}
.qr-box .qr-url{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:400;overflow-wrap:anywhere;margin-top:6px}
@media (max-width:480px){.qr-box{grid-template-columns:1fr;justify-items:center;text-align:center}}
.s-foot{border-top:2px solid var(--ink);padding-top:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-weight:700}
.brandline{font-size:.72rem;color:var(--muted)}

@media print{
  @page{margin:12mm}
  .panel,.demo-note{display:none!important}
  :root{--paper:#fff;--ink:#000;--muted:#444;--rule:#bbb;--desk:#fff}
  body,.stage{background:#fff}.app{display:block}.stage{padding:0}
  .sheet{box-shadow:none;max-width:none;padding:0}
  .when-block,.glance tr,.qr-box,.warn{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" aria-label="Schedule settings">
    <div class="brand">
      <h1><span class="drop-mark" aria-hidden="true"></span>Dropwise</h1>
      <p>Post-op eye drop schedules in your patient's language</p>
    </div>

    <fieldset>
      <legend>Procedure</legend>
      <label>Surgery
        <select id="surgery">
          <option value="cataract">Cataract (phaco + IOL)</option>
          <option value="trab">Trabeculectomy</option>
          <option value="ppv">Pars plana vitrectomy</option>
          <option value="dmek">DMEK (endothelial keratoplasty)</option>
          <option value="prk">PRK</option>
          <option value="lasik">LASIK</option>
        </select>
      </label>
      <div class="seg" role="radiogroup" aria-label="Operated eye">
        <input type="radio" name="eye" id="eyeR" value="R" checked><label for="eyeR">Right · OD</label>
        <input type="radio" name="eye" id="eyeL" value="L"><label for="eyeL">Left · OS</label>
      </div>
      <div class="row">
        <label>Surgery date<input type="date" id="sdate"></label>
        <label>Drops start<input type="date" id="start"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Patient sheet</legend>
      <label>Language<select id="lang"></select></label>
      <label class="check"><input type="checkbox" id="bi" checked> Show English under each line</label>
      <div class="row">
        <label>Patient name<input type="text" id="patient" placeholder="Leave blank to handwrite" autocomplete="off"></label>
        <label>Clinic phone<input type="text" id="phone" placeholder="e.g. 604-555-0100"></label>
      </div>
      <div class="row">
        <label>Wakes up<input type="time" id="wake" value="08:00"></label>
        <label>Goes to bed<input type="time" id="bed" value="22:00"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Drops &amp; taper</legend>
      <div class="drops" id="drops"></div>
      <button class="btn" type="button" id="addDrop">+ Add a drop</button>
    </fieldset>

    <fieldset>
      <legend>Patient phone page</legend>
      <div class="btns">
        <button class="btn solid" type="button" id="openPatient">Open phone view</button>
        <button class="btn" type="button" id="copyLink">Copy link</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </fieldset>

    <div class="basis" id="basis"></div>
  </aside>

  <main class="stage">
    <div class="demo-note"><b>Not yet for clinical use.</b> Regimens are common published defaults, not a standard of care. Translations are AI drafts pending review by certified medical translators.</div>
    <article class="sheet" id="sheet"></article>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="js/core.js"></script>
<script src="js/builder.js"></script>
</body>
</html>
