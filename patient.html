<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dropwise · My eye drops</title>
<meta name="theme-color" content="#1d5a86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dropwise">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Gurmukhi:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<link rel="stylesheet" href="css/dropwise.css">
<style>
/* Layout: one phone-width column. The next dose sits on top, then today's list, actions, the taper, and safety info. */
body{background:var(--desk);font-size:17px}
body:lang(ar){font-size:18px}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:700;display:flex;align-items:center;gap:7px;font-family:var(--f-body)}
.drop-mark{width:11px;height:15px;background:var(--accent);border-radius:50%/60% 60% 40% 40%;transform:rotate(180deg);display:inline-block}
.top select{font-size:.85rem;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:6px 8px;max-width:58%}
.card{background:var(--paper);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(20,30,45,.06),0 4px 16px rgba(20,30,45,.06);display:flex;flex-direction:column;gap:12px}
.hero{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero h1{margin:0;font-size:1.15rem;line-height:1.3}
.hero .day{color:var(--muted);font-size:.95rem;margin-top:2px}
.eye-badge{border:3px solid var(--ink);border-radius:10px;padding:6px 12px;text-align:center;font-weight:700;font-size:1.1rem;line-height:1.2}
.eye-badge small{display:block;font-family:var(--f-mono);font-size:.65rem;letter-spacing:.1em;color:var(--muted)}
.next{border:2px solid var(--accent)}
.next .label{font-size:.8rem;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.next .label:lang(zh-Hans),.next .label:lang(zh-Hant),.next .label:lang(ja),.next .label:lang(ko),.next .label:lang(ar),.next .label:lang(pa){text-transform:none;letter-spacing:0}
.next time{font-family:var(--f-mono);font-size:2.4rem;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.next-drugs{display:flex;flex-direction:column;gap:10px}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px}
.big{border:0;border-radius:12px;padding:15px 16px;font-weight:700;font-size:1.05rem;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.big.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.big.done{background:var(--good-bg);color:var(--good)}
.big.wide{width:100%}
.help{font-size:.85rem;color:var(--muted);margin:0}
.msg{font-size:1rem;font-weight:700}
h2{margin:0;font-size:1.1rem}
.today-list{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:26px 5em minmax(0,1fr) 40px;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:start;width:100%;cursor:pointer}
.trow:first-child{border-top:0}
.trow time{font-family:var(--f-mono);font-size:.95rem;font-variant-numeric:tabular-nums}
.trow .ico{width:22px;height:22px;color:var(--muted)}
.trow .chips{display:flex;flex-wrap:wrap;gap:4px 10px}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;justify-self:end}
.trow.is-done .tick{background:var(--good);border-color:var(--good)}
.trow.is-done .tick::after{content:"";width:9px;height:15px;border:solid var(--paper);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.trow.is-done time,.trow.is-done .chips{opacity:.55}
.trow.is-next{background:color-mix(in srgb,var(--flu) 22%,transparent);border-radius:8px}
.prn-line{border:0;padding:8px 0 0;font-size:.9rem}
.call{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700}
.call a{color:var(--accent)}
.foot{font-size:.8rem;color:var(--muted);text-align:center}
.invalid{text-align:center;padding:40px 18px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="js/core.js"></script>
<script src="js/patient.js"></script>
</body>
</html>
